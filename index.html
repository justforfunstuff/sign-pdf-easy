<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign PDF Easy</title>
  <meta name="description" content="Sign PDF Easy: a free Windows app for signing PDF documents.">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root { --bg: #f7f8fb; --text: #14213d; --accent: #1a56db; }
    @media (prefers-color-scheme: dark) { :root { --bg: #10131a; --text: #e8ecf5; --accent: #6b9bff; } }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 0 16px; box-sizing: border-box;
    }
    main { text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 600; margin: 20px 0 0; letter-spacing: -0.01em; }
    p { margin: 18px 0 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1>Sign PDF Easy</h1>
    <p><a href="privacy/">Privacy Policy</a></p>
  </main>
</body>
</html>
